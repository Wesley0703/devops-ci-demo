
name: CI

# 每次 push 與 PR 都觸發
on:
  push:
  pull_request:

jobs:
  test:
    name: Run pytest
    runs-on: ubuntu-latest
    steps:
      # 取得程式碼
      - uses: actions/checkout@v4

      # 安裝 Python 3.11
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 安裝相依套件
      - run: pip install -r requirements.txt

      # 執行測試
      - run: pytest -v
